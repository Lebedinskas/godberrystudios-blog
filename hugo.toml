[params]
  description = "Build smarter workflows with powerful web scraping and content automation tools. Tutorials, guides, and tools by Godberry Studios."
  author = "Godberry Studios"
  tagline = "Web Scraping & Content Automation"
  ogImage = "https://godberrystudios.com/images/og-default.png"

  [params.social]
    facebook = "https://www.facebook.com/profile.php?id=61570965581596"
    facebookPageId = "61570965581596"
    linkedin = "https://www.linkedin.com/in/tomas-lebedinskas-446103196/"

[markup]
  [markup.highlight]
    style = "monokai"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML", "Markdown"]

[outputFormats.Markdown]
  mediaType = "text/markdown"
  isPlainText = true
  notAlternative = true
  permalinkable = false

[mediaTypes."text/markdown"]
  suffixes = ["md"]

